<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#edf2f5">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Fairy">
  <link rel="manifest" href="/assets/manifest.webmanifest">
  <link rel="icon" href="/assets/fairy-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/style.css">
  <title>Fairy</title>
</head>
<body>
  <aside class="sidebar">
    <div class="window-chrome" aria-hidden="true"><i></i><i></i><i></i></div>
    <h1>Fairy</h1>
    <p>认知与自主能力工作台</p>
    <nav id="nav" aria-label="Fairy 管理导航"></nav>
    <p class="hint">开发版 0.3<br>状态以真实 API 为准</p>
  </aside>
  <main>
    <header>
      <div>
        <h1 id="title">运行概览</h1>
        <p id="status">未连接</p>
      </div>
      <div class="header-actions">
        <button id="notificationButton" class="icon-button notification-button" type="button" aria-label="打开通知中心" title="通知中心">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 10a5.5 5.5 0 0 1 11 0v4l1.5 2.5h-14L6.5 14zM10 19h4"/></svg>
          <span id="notificationBadge" class="notification-badge" hidden>0</span>
        </button>
        <form id="login">
          <input id="token" type="password" placeholder="本地服务令牌" autocomplete="off" aria-label="服务令牌">
          <button>连接</button>
        </form>
      </div>
    </header>
    <section id="syncNotice" class="sync-notice" hidden role="status">
      <span id="syncNoticeText">当前页面有新的后台更新。</span>
      <button id="syncRefresh" class="button button-secondary" type="button">刷新页面</button>
    </section>
    <section id="content" aria-live="polite"></section>
    <p id="error" role="alert"></p>
  </main>
  <nav id="mobileTabs" class="mobile-tabs" aria-label="iPhone 导航">
    <a href="#overview">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20h-6v-6h-4v6H4z"/></svg>
      <span>运行</span>
    </a>
    <a href="#chat">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5h14v10H9l-4 3z"/></svg>
      <span>对话</span>
    </a>
    <a href="#memories">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5 14.1 10l5.9.3-4.6 3.7 1.4 5.8-4.8-3.4-5 3.4 1.5-5.8L4 10.3l6-.3z"/></svg>
      <span>记忆</span>
    </a>
    <a href="#learning">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 5.5h6a2 2 0 0 1 2 2v11a2 2 0 0 0-2-2h-6zM19.5 5.5h-4a2 2 0 0 0-2 2v11a2 2 0 0 1 2-2h4z"/></svg>
      <span>学习</span>
    </a>
    <a href="#evolution">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 17c3.4 0 3.4-10 7-10 2.2 0 2.7 5.5 7 5.5M15 9l4 3.5-4 3.5"/></svg>
      <span>自主</span>
    </a>
  </nav>
  <dialog id="detailDialog" class="detail-dialog" aria-labelledby="dialogTitle">
    <div class="dialog-surface">
      <div class="dialog-header">
        <h2 id="dialogTitle">记录详情</h2>
        <button class="icon-button" type="button" aria-label="关闭详情" data-close-dialog>×</button>
      </div>
      <div id="dialogBody" class="dialog-body"></div>
    </div>
  </dialog>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
