[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "fariy-new"
version = "0.3.0"
requires-python = ">=3.11"
description = "Fairy local-first Ollama companion with reviewed memory"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "websockets>=13,<16", "sqlalchemy>=2,<3", "httpx>=0.27,<1", "psycopg[binary]>=3.2,<4", "pypdf>=7.1,<8", "psutil>=6,<8"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[tool.setuptools.packages.find]
where = ["server"]
[tool.pytest.ini_options]
pythonpath = ["server"]
testpaths = ["tests"]
